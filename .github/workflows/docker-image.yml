# Build and push the privacy-indexer image only for tagged mainnet/testnet deployments.
#
# Deployment consumes immutable image digests through perc20-deploy.
name: docker-image

env:
  PERC20_PROTOCOL_VERSION: perc20-v2

on:
  push:
    tags:
      - 'stack-main-*'
      - 'stack-develop-*'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deployment_tag:
        description: Existing deployment tag (stack-main-* or stack-develop-*)
        required: true
        type: string

concurrency:
  group: docker-image-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.deployment_tag) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    if: github.event_name != 'pull_request' && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_branch: ${{ steps.source.outputs.source_branch }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      deployment_tag: ${{ steps.source.outputs.deployment_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and verify deployment tag
        id: source
        env:
          DEPLOYMENT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_tag || github.ref_name }}
          EXPECTED_EVENT_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
        run: bash .github/scripts/resolve-deployment-tag.sh

  test:
    needs: source
    # PRs keep their existing tests; an invalid/deleted tag never starts tests.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.source.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.source_commit || github.sha }}
      - name: Test locked dependency graph
        run: cargo test --locked

  build-push:
    needs: [source, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      PERC20_SOURCE_BRANCH: ${{ needs.source.outputs.source_branch }}
      PERC20_SOURCE_COMMIT: ${{ needs.source.outputs.source_commit }}
      PERC20_DEPLOYMENT_TAG: ${{ needs.source.outputs.deployment_tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PERC20_SOURCE_COMMIT }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/privacy-indexer
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ env.PERC20_SOURCE_BRANCH }}-${{ env.PERC20_SOURCE_COMMIT }}
            type=raw,value=sha-${{ env.PERC20_SOURCE_COMMIT }}
          labels: |
            org.opencontainers.image.revision=${{ env.PERC20_SOURCE_COMMIT }}
            io.perc20.protocol=${{ env.PERC20_PROTOCOL_VERSION }}
            io.perc20.source_branch=${{ env.PERC20_SOURCE_BRANCH }}
            io.perc20.deployment_tag=${{ env.PERC20_DEPLOYMENT_TAG }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Production servers are x86_64. Add linux/arm64 if you also deploy
          # to ARM hosts (Rust cross-builds under QEMU are slow).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable release input
        run: |
          echo "privacy-indexer=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "source_branch=${PERC20_SOURCE_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
          echo "source_commit=${PERC20_SOURCE_COMMIT}" >> "$GITHUB_STEP_SUMMARY"
          echo "deployment_tag=${PERC20_DEPLOYMENT_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "protocol=${PERC20_PROTOCOL_VERSION}" >> "$GITHUB_STEP_SUMMARY"
